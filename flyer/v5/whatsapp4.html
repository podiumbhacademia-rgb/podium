<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Imagem WhatsApp 4</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#FFF3E2;--ink:#16110E;--yellow:#FFC72C;--red:#D20410}
html,body{width:540px;height:675px}
body{font-family:Montserrat,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.page{position:relative;width:540px;height:675px;overflow:hidden;background:radial-gradient(ellipse 120% 70% at 50% 32%,#EE0617 0%,#D20410 55%,#A80309 100%)}
.abs{position:absolute}
.mx{font-weight:900;font-style:italic;text-transform:uppercase}
.mb{font-weight:800;text-transform:uppercase}
.hero{left:50%;top:-10px;width:440px;height:261px;transform:translateX(-50%);object-fit:cover;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent),linear-gradient(#000 92%,transparent);-webkit-mask-composite:source-in;mask-composite:intersect}
.band{left:50%;top:240px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(90deg,#F2DEC6,#FFF3E2 30%,#FFF3E2 70%,#F2DEC6);color:var(--ink);border-radius:6px;padding:5px 14px 4px;font-size:13px;box-shadow:0 3px 10px rgba(70,0,5,.3)}
.pol{background:#fff;padding:6px 6px 7px;box-shadow:0 8px 18px rgba(50,0,4,.45)}
.pol img{display:block;width:100%;height:100%;object-fit:cover}
.p1{left:18px;top:296px;width:124px;height:155px;transform:rotate(-7deg)}
.p2{left:134px;top:284px;width:144px;height:180px;transform:rotate(-1.5deg);z-index:2}
.p3{left:264px;top:286px;width:144px;height:180px;transform:rotate(3deg);z-index:2}
.p4{left:400px;top:300px;width:124px;height:155px;transform:rotate(7deg)}
.tape{position:absolute;width:46px;height:14px;background:rgba(255,236,190,.85);top:-7px;left:50%;transform:translateX(-50%) rotate(-4deg)}
.cap{left:0;right:0;top:470px;text-align:center;font-family:Caveat,cursive;font-size:25px;line-height:1;color:var(--cream)}
.cap b{color:var(--yellow);font-weight:700}
.date{left:0;right:0;top:505px;text-align:center;font-size:21px;line-height:1;text-shadow:0 2px 0 rgba(90,0,5,.35)}
.atr{left:20px;right:20px;top:534px;text-align:center;font-size:12px;line-height:1.5}
.atr i{font-style:normal;color:var(--yellow);margin:0 5px}
.pill{left:50%;top:584px;transform:translateX(-50%);background:var(--ink);border-radius:999px;padding:7px 22px 6px;font-size:21px;line-height:1;white-space:nowrap;box-shadow:0 6px 16px rgba(40,0,0,.35)}
.link{left:0;right:0;top:625px;display:flex;justify-content:center;align-items:center;gap:7px;font-size:13.5px}
.link svg{width:14px;height:18px}
.x{width:30px}
</style></head><body><div class="page">
<img class="abs hero" src="hero.jpg" alt="">
<div class="abs band mb">Confraternização de fim de ano</div>

<div class="abs pol p1"><img src="foto-placa.jpg" alt=""></div>
<div class="abs pol p2"><span class="tape"></span><img src="foto-galera.jpg" alt=""></div>
<div class="abs pol p3"><span class="tape"></span><img src="foto-grupo.jpg" alt=""></div>
<div class="abs pol p4"><img src="foto-danca.jpg" alt=""></div>

<div class="abs cap">Ano passado foi assim… <b>esse ano tem mais!</b></div>
<div class="abs date mx">Domingo · 13 dez · 14h · Boa Vista</div>
<div class="abs atr mb">Churrasco + tropeiro<i>×</i>DJ a tarde toda<i>×</i>Açaí<br>Piscina liberada<i>×</i>leve traje de banho e sua bebida</div>
<div class="abs pill mx">Vendas abertas!</div>
<div class="abs link mb">Link pra comprar aqui embaixo

</div></body></html>
