<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Imagem WhatsApp 2</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#D20410;--cream:#FFF3E2;--ink:#16110E;--yellow:#FFC72C;--pool:#2BC0DA;--pool2:#1597B5}
html,body{width:540px;height:675px}
body{font-family:Montserrat,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.page{position:relative;width:540px;height:675px;overflow:hidden;background:radial-gradient(ellipse 120% 70% at 50% 30%,#F20A1A 0%,#D20410 55%,#A80309 100%)}
.abs{position:absolute}
.rays{left:50%;top:190px;width:900px;height:900px;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 7deg,transparent 7deg 18deg);-webkit-mask-image:radial-gradient(circle,#000 20%,transparent 62%)}
.hero{left:0;top:-14px;width:540px;height:320px;object-fit:cover;-webkit-mask-image:linear-gradient(#000 97%,transparent)}
.mx{font-weight:900;font-style:italic;text-transform:uppercase}
.mb{font-weight:800;text-transform:uppercase}
.spark{fill:var(--yellow)}
/* data em forma de ingresso */
.tk{left:50%;top:310px;transform:translateX(-50%) rotate(-2deg);display:flex;align-items:stretch;background:var(--cream);color:var(--ink);border-radius:10px;box-shadow:0 6px 16px rgba(60,0,4,.4);white-space:nowrap}
.tk .a{padding:7px 14px 6px;font-size:22px;line-height:1}
.tk .a small{display:block;font-size:11px;font-weight:800;font-style:normal;color:var(--red);letter-spacing:.06em;margin-bottom:2px}
.tk .b{white-space:nowrap;border-left:2px dashed rgba(22,17,14,.3);padding:7px 14px 6px;font-size:14px;line-height:1.3;display:flex;flex-direction:column;justify-content:center}
.tk .b span{color:var(--red)}
/* adesivos */
.stk{display:flex;align-items:center;gap:7px;border-radius:12px;padding:8px 13px 8px 10px;font-weight:900;font-size:14px;line-height:1.05;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);border:2.5px solid var(--ink);white-space:nowrap}
.stk svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.s1{left:24px;top:382px;background:var(--yellow);transform:rotate(-4deg)}
.s2{left:208px;top:378px;background:var(--cream);transform:rotate(3deg)}
.s3{left:396px;top:386px;background:#C77DFF;transform:rotate(-3deg)}
.s4{left:74px;top:438px;background:var(--pool);transform:rotate(2deg)}
.s5{left:284px;top:436px;background:#FF8A1F;transform:rotate(-2deg)}
.leve{left:0;right:0;top:490px;text-align:center;font-weight:800;font-size:13px}
.leve b{color:var(--yellow)}
/* piscina */
.water{left:0;right:0;bottom:0;height:150px}
.cta{left:34px;right:34px;top:518px;background:var(--yellow);color:var(--ink);border-radius:16px;padding:10px 14px 10px;text-align:center;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 16px 30px rgba(0,40,60,.4);transform:rotate(-1.5deg)}
.cta .t1{font-size:14px;color:var(--red)}
.cta .t2{font-size:25px;line-height:1.02;margin-top:2px}
.arrows{left:0;right:0;top:618px;display:flex;justify-content:center;gap:18px}
.arrows svg{width:30px;height:38px;filter:drop-shadow(0 3px 3px rgba(0,40,60,.5))}
</style></head><body><div class="page">
<div class="abs rays"></div>

<div class="abs stk s2"><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>DJ a tarde<br>toda</div>
<div class="abs stk s3"><svg viewBox="0 0 24 24"><path d="M5 10h14l-2 10H7z"/><path d="M7 10a5 5 0 0 1 10 0"/><path d="M12 5V2"/></svg>Açaí</div>

<div class="abs stk s5"><svg viewBox="0 0 24 24"><path d="M12 3v3"/><circle cx="12" cy="12" r="6"/><path d="M6.5 10h11M6.5 14h11M12 6c-2 2-2 10 0 12M12 6c2 2 2 10 0 12"/></svg>Muita animação</div>
