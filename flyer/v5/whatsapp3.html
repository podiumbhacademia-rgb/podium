<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Imagem WhatsApp 3</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#FFF3E2;--ink:#16110E;--yellow:#FFC72C;--red:#D20410}
html,body{width:540px;height:675px}
body{font-family:Montserrat,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.page{position:relative;width:540px;height:675px;overflow:hidden;background:radial-gradient(ellipse 120% 70% at 50% 32%,#EE0617 0%,#D20410 55%,#A80309 100%)}
.abs{position:absolute}
.hero{left:0;top:-14px;width:540px;height:320px;object-fit:cover;-webkit-mask-image:linear-gradient(#000 97%,transparent)}
.palm{opacity:.3;width:150px}
.mx{font-weight:900;font-style:italic;text-transform:uppercase}
.mb{font-weight:800;text-transform:uppercase}
.band{left:50%;top:306px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(90deg,#F2DEC6,#FFF3E2 30%,#FFF3E2 70%,#F2DEC6);color:var(--ink);border-radius:6px;padding:6px 16px 5px;font-size:14.5px;box-shadow:0 3px 10px rgba(70,0,5,.3)}
.date{left:0;right:0;top:350px;text-align:center;font-size:30px;line-height:1;text-shadow:0 3px 0 rgba(90,0,5,.35)}
.loc{left:50%;top:390px;transform:translateX(-50%);background:var(--ink);border-radius:999px;padding:5px 18px;font-size:13px;letter-spacing:.14em;white-space:nowrap}
.atr{left:30px;right:30px;top:436px;text-align:center;font-size:15.5px;line-height:1.55;letter-spacing:.01em}
.atr i{font-style:normal;color:var(--yellow);margin:0 7px}
.leve{left:0;right:0;top:490px;text-align:center;font-weight:700;font-style:italic;font-size:13.5px;color:rgba(255,243,226,.9)}
.pill{left:50%;top:524px;transform:translateX(-50%);background:var(--ink);border-radius:999px;padding:8px 26px 7px;font-size:25px;line-height:1;white-space:nowrap;box-shadow:0 6px 16px rgba(40,0,0,.35)}
.link{left:0;right:0;top:572px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:15px}
.link svg{width:16px;height:20px}
.deck{left:0;bottom:0;width:540px;height:96px;object-fit:cover;object-position:top;-webkit-mask-image:linear-gradient(transparent,#000 45%)}
</style></head><body><div class="page">
<img class="abs palm" src="coqueiro.svg" style="left:-56px;top:300px" alt="">
<img class="abs palm" src="coqueiro.svg" style="right:-56px;top:290px;transform:scaleX(-1)" alt="">
<img class="abs hero" src="hero.jpg" alt="">
<div class="abs band mb">Confraternização de fim de ano</div>
<div class="abs date mx">Domingo · 13 dez · 14h</div>
<div class="abs loc mb">Boa Vista · BH</div>
<div class="abs atr mb">Churrasco + tropeiro<i>×</i>DJ a tarde toda<br>Açaí<i>×</i>Piscina liberada<i>×</i>Muita animação</div>
<div class="abs leve">Leve seu traje de banho e sua bebida favorita</div>

<div class="abs link mb">Link pra comprar aqui embaixo

<img class="abs deck" src="deck.jpg" alt="">
</div></body></html>
