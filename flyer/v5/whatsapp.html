<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Imagem WhatsApp</title>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#D20410;--red-dk:#8E0610;--cream:#FFF3E2;--ink:#16110E;--yellow:#FFC72C}
html,body{width:540px;height:675px}
body{font-family:Montserrat,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.page{position:relative;width:540px;height:675px;overflow:hidden;background:radial-gradient(ellipse 120% 70% at 50% 35%,#EE0617 0%,#D20410 55%,#A80309 100%)}
.abs{position:absolute}
.hero{left:0;top:-6px;width:540px;height:320px;object-fit:cover;-webkit-mask-image:linear-gradient(#000 97%,transparent)}
.palm{opacity:.3;width:150px}
.mx{font-weight:900;font-style:italic;text-transform:uppercase}
.mb{font-weight:800;text-transform:uppercase}
.band{left:50%;top:310px;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(90deg,#F2DEC6,#FFF3E2 30%,#FFF3E2 70%,#F2DEC6);color:var(--ink);border-radius:6px;padding:6px 14px 5px;font-size:14px;box-shadow:0 3px 10px rgba(70,0,5,.3)}
.date{left:0;right:0;top:350px;text-align:center;font-size:25px;line-height:1;text-shadow:0 2px 0 rgba(90,0,5,.35)}
.loc{left:50%;top:382px;transform:translateX(-50%);background:var(--ink);border-radius:999px;padding:5px 16px;font-size:12.5px;letter-spacing:.12em;white-space:nowrap}
.atr{left:24px;right:24px;top:420px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 6px}
.atr div{display:flex;align-items:center;gap:6px;background:rgba(22,17,14,.78);border-radius:999px;padding:6px 12px 6px 9px;font-weight:800;font-size:12.5px}
.atr svg{width:17px;height:17px;stroke:var(--yellow);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.leve{left:0;right:0;top:491px;text-align:center;font-weight:700;font-size:12.5px;color:rgba(255,243,226,.92)}
.deck{left:0;bottom:0;width:540px;height:110px;object-fit:cover;-webkit-mask-image:linear-gradient(transparent,#000 40%)}
.cta{left:28px;right:28px;top:516px;background:var(--yellow);color:var(--ink);border-radius:14px;padding:11px 14px 10px;text-align:center;box-shadow:0 5px 0 #B8860B,0 12px 24px rgba(60,0,4,.45)}
.cta .t1{font-size:15px;color:var(--red);letter-spacing:.02em}
.cta .t2{font-size:24px;line-height:1.05;margin-top:2px}
.arrows{left:0;right:0;top:606px;display:flex;justify-content:center;gap:16px}
.arrows svg{width:34px;height:40px;filter:drop-shadow(0 3px 4px rgba(40,0,0,.5))}
</style></head><body><div class="page">
<img class="abs palm" src="coqueiro.svg" style="left:-56px;top:300px" alt="">
<img class="abs palm" src="coqueiro.svg" style="right:-56px;top:290px;transform:scaleX(-1)" alt="">
<img class="abs hero" src="hero.jpg" alt="">
<div class="abs band mb">Confraternização de fim de ano</div>
<div class="abs date mx">Domingo · 13 dez · 14h</div>
<div class="abs loc mb">Boa Vista · BH</div>
<div class="abs atr">
  <div><svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M8 19l-2 3M16 19l2 3"/><path d="M9 3c1 1.5-1 2.5 0 4M13 3c1 1.5-1 2.5 0 4M17 4c.8 1.2-.8 2 0 3"/></svg>Churrasco + tropeiro</div>
  <div><svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1v-6h3zM3 19a2 2 0 0 0 2 2h1v-6H3z"/></svg>DJ a tarde toda</div>
  <div><svg viewBox="0 0 24 24"><path d="M5 10h14l-2 10H7z"/><path d="M7 10a5 5 0 0 1 10 0"/><path d="M12 5V2"/></svg>Açaí</div>
  <div><svg viewBox="0 0 24 24"><path d="M2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/><path d="M8 15V5a2 2 0 0 1 4 0M16 15V5a2 2 0 0 0-4 0M8 9h8M8 13h8"/></svg>Piscina liberada</div>
  <div><svg viewBox="0 0 24 24"><path d="M12 3v3"/><circle cx="12" cy="12" r="6"/><path d="M6.5 10h11M6.5 14h11M12 6c-2 2-2 10 0 12M12 6c2 2 2 10 0 12"/></svg>Muita animação</div>
</div>
<div class="abs leve">Leve seu traje de banho e sua bebida favorita!</div>
<img class="abs deck" src="deck.jpg" alt="">
<div class="abs cta"><div class="t1 mx">Vendas abertas!</div><div class="t2 mx">Link para comprar<br>aqui embaixo</div></div>
<div class="abs arrows">
  <svg viewBox="0 0 34 40"><path d="M17 3v28M5 21l12 14 12-14" fill="none" stroke="#FFC72C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg viewBox="0 0 34 40"><path d="M17 3v28M5 21l12 14 12-14" fill="none" stroke="#FFF3E2" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <svg viewBox="0 0 34 40"><path d="M17 3v28M5 21l12 14 12-14" fill="none" stroke="#FFC72C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
</div>
</div></body></html>
