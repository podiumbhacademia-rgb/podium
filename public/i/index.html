<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ingresso · 9 Anos de Podium</title>
<meta name="theme-color" content="#F68E14">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-sm.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
body{background:#ECEAE6}
.tkt{max-width:380px;margin:24px auto;border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.tkt .top{background:#F68E14;color:#FFF6E6;padding:20px 20px 22px}
.tkt .top img{width:104px}
.tkt .top h1{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:36px;line-height:1;margin-top:14px}
.tkt .top p{font-weight:600;font-size:15px}
.tkt .cut{height:22px;position:relative;background:var(--surface)}
.tkt .cut::before,.tkt .cut::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:#ECEAE6}
.tkt .cut::before{left:-11px}.tkt .cut::after{right:-11px}
.tkt .cut i{position:absolute;left:18px;right:18px;top:0;border-top:2px dashed var(--line2)}
.tkt .body{padding:4px 20px 22px;text-align:center}
.tkt .qr{background:#fff;padding:8px;width:240px;margin:0 auto 14px}
.tkt .name{font-family:Oswald,sans-serif;font-weight:600;font-size:28px;text-transform:uppercase;line-height:1.05}
.tkt .meta{margin-top:6px;font-size:14px;color:var(--soft)}
.used{color:var(--warn);font-weight:700;margin-top:12px}
</style>
</head>
<body>
<div class="wrap" id="root"><p class="center muted" style="padding:80px 0">Carregando ingresso…</p></div>
<script src="/vendor/qrcode.js"></script>
<script src="/assets/app.js"></script>
<script>
(async () => {
  const token = new URLSearchParams(location.search).get("t") || "";
  const root = $("#root");
  try {
    const t = await api("ticket?t=" + encodeURIComponent(token));
    const url = ticketURL(t.token);
    root.innerHTML = `
      <div class="tkt" id="tkt">
        <div class="top">
          <img src="/assets/logo-cream.png" alt="Podium Academia">
          <h1>9 anos de Podium</h1>
          <p>${EVENT.dateLabel}</p><p style="font-size:14px;opacity:.85">${EVENT.address}</p>
        </div>
        <div class="cut"><i></i></div>
        <div class="body">
          <div class="qr">${qrSVG(url, { ecc: "Q" })}</div>
          <div class="name">${esc(t.name)}</div>
          <div class="meta">${esc(t.catLabel)} · Pedido ${esc(t.orderId)}</div>
          ${t.checkedIn ? `<div class="used">Este ingresso já foi usado na entrada.</div>` : `<p class="muted small" style="margin-top:12px">Mostre este QR Code na portaria. Ele é pessoal e vale para uma entrada.</p>`}
        </div>
      </div>
      <div style="max-width:380px;margin:0 auto 40px">
        <button class="btn btn-red btn-block" id="save">Salvar ingresso como imagem</button>
        <p class="center small muted" style="margin-top:10px">Dica: tire um print ou salve a imagem pra ter o ingresso mesmo sem internet.</p>
      </div>`;
    $("#save").onclick = () => saveImage(t, url);
  } catch (e) {
    root.innerHTML = `<div class="card center" style="margin-top:80px"><img src="/assets/logo-dark.png" style="width:140px;margin:0 auto 14px"><h2 class="display" style="font-size:28px">Ingresso não encontrado</h2><p class="muted" style="margin-top:8px">${esc(e.message)} Se você já pagou, chame a gente no WhatsApp (31) 99622-1198.</p><a class="btn btn-red btn-block" style="margin-top:16px" href="/">Ir para o site</a></div>`;
  }
})();

async function saveImage(t, url){
  const W = 1080, H = 1700, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  await document.fonts.ready;
  g.fillStyle = "#ECEAE6"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#F68E14"; g.fillRect(0, 0, W, 520);
  const logo = await loadImg("/assets/logo-cream.png"); g.drawImage(logo, 70, 60, 300, 300 * logo.height / logo.width);
  g.fillStyle = "#FFF6E6"; g.font = "700 104px Oswald"; g.fillText("9 ANOS DE PODIUM", 70, 390);
  g.font = "600 42px Barlow"; g.fillText(EVENT.dateLabel, 70, 460);
  const qr = qrcode(0, "Q"); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), box = 640, x0 = (W - box) / 2, y0 = 600, cell = box / (n + 4);
  g.fillStyle = "#fff"; roundRect(g, x0 - 20, y0 - 20, box + 40, box + 40, 40); g.fill();
  g.fillStyle = "#131210";
  for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) g.fillRect(x0 + (col + 2) * cell, y0 + (r + 2) * cell, Math.ceil(cell), Math.ceil(cell));
  g.textAlign = "center"; g.fillStyle = "#24170F"; g.font = "600 76px Oswald";
  wrapText(g, t.name.toUpperCase(), W / 2, 1380, W - 120, 86);
  g.font = "600 40px Barlow"; g.fillStyle = "#6B5A4E"; g.fillText(`${t.catLabel}  ·  Pedido ${t.orderId}`, W / 2, 1600);
  const a = document.createElement("a"); a.download = `ingresso-podium-${t.name.split(" ")[0].toLowerCase()}.png`; a.href = c.toDataURL("image/png"); a.click();
}
function loadImg(src){ return new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = src; }); }
function roundRect(g, x, y, w, h, r){ g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrapText(g, text, x, y, maxW, lh){
  const words = text.split(" "); let line = "", lines = [];
  for (const w of words) { const test = line ? line + " " + w : w; if (g.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  lines.push(line); lines = lines.slice(0, 2);
  lines.forEach((l, i) => g.fillText(l, x, y + i * lh - (lines.length - 1) * lh / 2));
}
</script>
</body>
</html>
