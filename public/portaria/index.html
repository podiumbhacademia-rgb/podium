<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Portaria · 9 Anos de Podium</title>
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo-sm.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
<style>
.cam{position:relative;border-radius:var(--r);overflow:hidden;background:#1d1714;aspect-ratio:1/1}
.cam video{width:100%;height:100%;object-fit:cover}
.cam .frame{position:absolute;inset:14%;border:2px solid rgba(255,255,255,.9);border-radius:6px;box-shadow:0 0 0 2000px rgba(0,0,0,.3)}
.cam .start{position:absolute;inset:0;display:grid;place-items:center;background:#1d1714}
#result{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
#result.ok{background:#1F7A3F;color:#fff}
#result.repetido{background:#8A5A00;color:#fff}
#result.invalido,#result.inativo{background:#B80F1F;color:#fff}
#result .big{font-family:Oswald,sans-serif;font-weight:700;font-size:60px;line-height:1;text-transform:uppercase}
#result .nm{font-family:Oswald,sans-serif;font-weight:600;font-size:34px;text-transform:uppercase;line-height:1.05}
#result .sub{font-size:18px;font-weight:600;opacity:.92}
.counter{display:flex;justify-content:space-between;align-items:center;margin:14px 0}
.counter b{font-family:Oswald,sans-serif;font-size:34px;font-weight:600}
.gl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.gl.in{opacity:.55}
</style>
</head>
<body>
<div id="gate" class="gate hide">
  <form class="card" id="gateForm">
    <img src="/assets/logo-dark.png" alt="Podium">
    <h1 class="display" style="font-size:26px;margin-bottom:6px">Portaria</h1>
    <p class="muted small" style="margin-bottom:14px">Digite a senha</p>
    <input class="input pin" id="pinInput" inputmode="numeric" type="password" autocomplete="off" maxlength="12">
    <button class="btn btn-red btn-block" style="margin-top:12px">Entrar</button>
  </form>
</div>

<div id="app" class="hide">
  <div class="topbar"><div class="wrap">
    <img src="/assets/logo-dark.png" alt="Podium">
    <span class="title">Portaria</span>
    <button data-logout>Sair</button>
  </div></div>
  <div class="wrap" style="padding-top:14px;padding-bottom:60px">
    <div class="cam" id="cam">
      <video id="video" playsinline muted></video>
      <div class="frame"></div>
      <div class="start" id="startBox"><button class="btn btn-red" id="startCam">Abrir câmera e ler QR</button></div>
    </div>
    <div class="counter"><div><b id="cIn">0</b> <span class="muted">entraram</span></div><div class="muted">de <b id="cTot" style="font-size:22px">0</b></div></div>

    <h3 class="sec-h" style="margin-top:8px">Buscar por nome</h3>
    <input class="input" id="q" placeholder="Digite o nome…">
    <div class="list" id="guest" style="margin-top:10px"></div>
  </div>
</div>

<div id="result" class="hide"></div>

<script src="/vendor/jsQR.js"></script>
<script src="/assets/app.js"></script>
<script>
let PIN = "", LIST = [], scanning = false, busy = false, lastCode = "", lastAt = 0, stream;
const video = $("#video"), canvas = document.createElement("canvas"), ctx = canvas.getContext("2d", { willReadFrequently: true });
const detector = ("BarcodeDetector" in window) ? new BarcodeDetector({ formats: ["qr_code"] }) : null;

pinGate("podium9_portaria", (pin) => { PIN = pin; loadList(); setInterval(loadList, 30000); });

async function loadList(){
  try { LIST = (await api("portaria/list", { pin: PIN })).list; renderList(); } catch (e) { toast(e.message); }
}
function renderList(){
  $("#cIn").textContent = LIST.filter((g) => g.checkedInAt).length; $("#cTot").textContent = LIST.length;
  const q = $("#q").value.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  if (q.length < 2) { $("#guest").innerHTML = ""; return; }
  const res = LIST.filter((g) => g.name.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").includes(q)).slice(0, 30);
  $("#guest").innerHTML = res.map((g) => `<div class="gl ${g.checkedInAt ? "in" : ""}"><div><b>${esc(g.name)}</b><div class="small muted">${esc(g.catLabel)} · ${g.orderId}${g.checkedInAt ? " · entrou " + fmtDT(g.checkedInAt) : ""}</div></div>
    ${g.checkedInAt ? `<button class="btn btn-ghost btn-sm" data-undo="${g.token}">desfazer</button>` : `<button class="btn btn-red btn-sm" data-in="${g.token}">Dar entrada</button>`}</div>`).join("") || `<p class="muted small">Ninguém com esse nome na lista de pagos.</p>`;
}
$("#q").addEventListener("input", renderList);
$("#guest").addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.in) checkin(b.dataset.in);
  if (b.dataset.undo && confirm("Desfazer a entrada desta pessoa?")) { await api("portaria/undo", { method: "POST", pin: PIN, body: { token: b.dataset.undo } }); loadList(); }
});

$("#startCam").onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false });
    video.srcObject = stream; await video.play();
    $("#startBox").classList.add("hide"); scanning = true; requestAnimationFrame(loop);
  } catch (e) { toast("Não consegui abrir a câmera. Libere a permissão no navegador."); }
};

async function loop(){
  if (!scanning) return;
  if (!busy && video.readyState >= 2) {
    let code = null;
    try {
      if (detector) { const r = await detector.detect(video); code = r[0]?.rawValue || null; }
      else {
        const s = Math.min(video.videoWidth, video.videoHeight), sz = 640;
        canvas.width = canvas.height = sz;
        ctx.drawImage(video, (video.videoWidth - s) / 2, (video.videoHeight - s) / 2, s, s, 0, 0, sz, sz);
        const img = ctx.getImageData(0, 0, sz, sz);
        code = jsQR(img.data, sz, sz, { inversionAttempts: "dontInvert" })?.data || null;
      }
    } catch {}
    if (code && !(code === lastCode && Date.now() - lastAt < 4000)) { lastCode = code; lastAt = Date.now(); checkin(code); }
  }
  setTimeout(() => requestAnimationFrame(loop), 120);
}

async function checkin(token, force){
  busy = true;
  try {
    const r = await api("portaria/checkin", { method: "POST", pin: PIN, body: { token, force } });
    show(r);
    loadList();
  } catch (e) { toast(e.message); busy = false; }
}

function beep(ok){
  try {
    const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain();
    o.frequency.value = ok ? 880 : 220; o.connect(g); g.connect(a.destination); g.gain.value = .15; o.start(); o.stop(a.currentTime + (ok ? .15 : .45));
  } catch {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 80, 200]);
}

function show(r){
  const el = $("#result"); el.className = r.result;
  const titles = { ok: "Pode entrar", repetido: "Já entrou!", invalido: "QR inválido", inativo: "Ingresso não ativo" };
  const subs = {
    ok: r.catLabel,
    repetido: `Entrada registrada às ${new Date(r.checkedInAt).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}. Confira com a pessoa.`,
    invalido: "Esse código não é um ingresso da festa.",
    inativo: "Pedido cancelado ou ainda não confirmado. Chame a organização.",
  };
  el.innerHTML = `<div class="big">${titles[r.result]}</div>${r.name ? `<div class="nm">${esc(r.name)}</div>` : ""}<div class="sub">${esc(subs[r.result] || "")}</div>
    <div class="row" style="margin-top:20px;gap:10px">${r.result === "repetido" ? `<button class="btn btn-ghost" id="force">Liberar mesmo assim</button>` : ""}<button class="btn btn-light" id="next">Próximo</button></div>`;
  beep(r.result === "ok");
  $("#next").onclick = hide;
  const f = $("#force"); if (f) f.onclick = () => { hide(); checkin(r.token, true); };
  clearTimeout(el._t); if (r.result === "ok") el._t = setTimeout(hide, 2500);
}
function hide(){ $("#result").className = "hide"; busy = false; }
</script>
</body>
</html>
